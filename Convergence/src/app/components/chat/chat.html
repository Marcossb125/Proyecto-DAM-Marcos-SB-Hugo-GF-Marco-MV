<app-top-actions></app-top-actions>

<div class="chat-wrapper">
  <!-- ═══ TACTICAL GRID BACKGROUND ═══ -->
  <div class="tactical-grid"></div>
  <div class="scanline"></div>

  <!-- ═══ HEADER ═══ -->
  <app-banner title="CONVERGENCE" subtitle="CANAL DE CHAT GLOBAL" [showEmblem]="true"></app-banner>

  <!-- ═══ MESSAGES AREA ═══ -->
  <main class="messages-container" #scrollContainer>
    <div class="message-history">
      @for (message of messages(); track message.id) {
        <div class="message-wrapper" [class.self]="message.isSelf">
          <div class="message-meta">
            <span class="sender-name">{{ message.sender }}</span>
            <span class="message-time">{{ message.timestamp | date:'HH:mm' }}</span>
          </div>
          <div class="message-bubble">
            <p class="message-text">{{ message.content }}</p>
          </div>
        </div>
      }
    </div>
  </main>

  <!-- ═══ INPUT AREA ═══ -->
  <footer class="chat-footer">
    <div class="input-container">
      <input 
        type="text" 
        [(ngModel)]="newMessage" 
        (keyup.enter)="sendMessage()"
        placeholder="Escribe un mensaje..." 
        class="chat-input"
      >
      <button class="btn-send" (click)="sendMessage()">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </footer>

  <!-- ═══ NAVBAR INFERIOR ═══ -->
  <app-bottom-navbar activePage="/chat"></app-bottom-navbar>
</div>
