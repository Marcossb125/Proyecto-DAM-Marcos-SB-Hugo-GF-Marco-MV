<!-- ═══════════════════════════════════════════════════════════════
     PREMIUM HUD TEMPLATE
     ═══════════════════════════════════════════════════════════════ -->

<!-- ═══ TOP BAR ═══ -->
<app-hud-top-bar
  [phase]="phase$ | async"
  [currentTurn]="currentTurn$ | async"
  [isReady]="(localPlayer$ | async)?.isReady || false"
  (phaseAction)="onPhaseAction($event)">
</app-hud-top-bar>

<!-- ═══ LEFT PANEL (Resources) ═══ -->
<app-hud-resources 
  [player]="(localPlayer$ | async)!"
  [isCollapsed]="isResourcesCollapsed"
  (toggle)="toggleResources()">
</app-hud-resources>

<!-- ═══ RIGHT PANEL (Game Log) ═══ -->
<app-hud-log
  [gameLogs]="gameLogs"
  [isOpen]="isLogOpen"
  (toggle)="toggleLog()">
</app-hud-log>

<!-- ═══ BOTTOM BAR (Command & Abort) ═══ -->
<app-hud-bottom-bar
  (abortMission)="onBackToInicio()">
</app-hud-bottom-bar>
