$kind: http-request
name: 'POST Register Duplicado'
method: POST
url: '{{BASE_URL}}/auth/register'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nickname": "{{NICK1}}",
      "password": "otrapass",
      "email": "{{NICK1}}@test.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409 - Duplicado", () => pm.response.to.have.status(409));
