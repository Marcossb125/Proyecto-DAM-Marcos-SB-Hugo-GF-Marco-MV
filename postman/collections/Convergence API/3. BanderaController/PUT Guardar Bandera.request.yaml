$kind: http-request
name: 'PUT Guardar Bandera'
method: PUT
url: '{{BASE_URL}}/bandera/guardar'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nickname": "{{NICK1}}",
      "nombre": "Faccion Test",
      "bandera": {
        "layout": "diagonal",
        "colors": ["#FF0000", "#FFFFFF", "#0000FF"]
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Bandera guardada", () => pm.response.to.have.status(200));
