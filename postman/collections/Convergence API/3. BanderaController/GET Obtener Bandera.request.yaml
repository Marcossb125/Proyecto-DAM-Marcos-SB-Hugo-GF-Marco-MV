$kind: http-request
name: 'GET Obtener Bandera'
method: GET
url: '{{BASE_URL}}/bandera/{{NICK1}}'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Bandera obtenida", () => pm.response.to.have.status(200));
