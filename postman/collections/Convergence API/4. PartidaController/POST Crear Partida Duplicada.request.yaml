$kind: http-request
name: 'POST Crear Partida Duplicada'
method: POST
url: '{{BASE_URL}}/partidas/crear'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
body:
  type: json
  content: |-
    {
      "nombre": "{{MATCH_NAME}}",
      "jugadores_limite": 4,
      "hostNombre": "{{NICK1}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409 - Partida duplicada", () => pm.response.to.have.status(409));
