$kind: http-request
name: 'GET Obtener Partida Por Nombre'
method: GET
url: '{{BASE_URL}}/partidas/nombre/{{MATCH_NAME}}'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Partida encontrada por nombre", () => pm.response.to.have.status(200));
