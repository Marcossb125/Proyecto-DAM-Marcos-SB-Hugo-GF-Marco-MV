$kind: http-request
name: 'DELETE Partida No Host'
method: DELETE
url: '{{BASE_URL}}/partidas/{{MATCH_ID}}'
order: 10000
queryParams:
  - key: requester
    value: '{{NICK2}}'
headers:
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403 - No es el host", () => pm.response.to.have.status(403));
