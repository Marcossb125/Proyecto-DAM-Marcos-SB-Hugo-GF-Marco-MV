$kind: http-request
name: 'GET General Usuario No Existe'
method: GET
url: '{{BASE_URL}}/general/noexiste_{{TS}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404 - Usuario no existe", () => pm.response.to.have.status(404));
