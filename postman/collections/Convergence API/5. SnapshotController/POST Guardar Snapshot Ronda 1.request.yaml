$kind: http-request
name: 'POST Guardar Snapshot Ronda 1'
method: POST
url: '{{BASE_URL}}/snapshots/guardar'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{TOKEN}}'
    enabled: true
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "matchId": "{{SNAP_ID}}",
      "ronda": 1,
      "stateJson": "{\"turno\":1,\"recursos\":{\"oro\":100,\"madera\":50}}",
      "idHost": "{{NICK1}}",
      "idGanador": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 - Snapshot ronda 1 guardado", () => pm.response.to.have.status(200));
