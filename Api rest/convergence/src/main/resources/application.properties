spring.application.name=convergence
# MySQL datasource for the 'convergence' database running on localhost:3306
# Use environment variables DB_USER and DB_PASS to avoid hardcoding credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/convergence?serverTimezone=UTC&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari pool (reasonable defaults for a small app)
spring.datasource.hikari.maximum-pool-size=5

# Optional: show SQL in logs during development
spring.jpa.show-sql=false

# Secret for generating JWTs
jwt.secret=${JWT_SECRET:acc157964033b7e0eb3768430bbd8127b96015ee114a7c88c7659c90b7968ff4d1709066bf9549a8072fcca189214a9a80b4fee2ac07c7045b374cde44909444}

# Credenciales del usuario dedicado del middleware (usuario de MySQL)
backend.auth.username=${BACKEND_USER:middleware_service}
backend.auth.password=${BACKEND_PASSWORD:Mid2024!}
